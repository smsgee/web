<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SMSGEE - On-Device Biometric Intelligence, Edge Computer Vision, and Face Explorer: The Ultra-Fast 100% Private Local Photo Organizer.">
  <meta name="keywords" content="SMSGEE, Face Explorer, Biometrics, On-Device AI, Face Clustering, Edge Computer Vision, Privacy AI, SIMD C++">
  <meta name="author" content="SMSGEE Inc.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- OpenGraph / Social Meta -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="SMSGEE | On-Device Biometric Intelligence & Face Explorer">
  <meta property="og:description" content="Ultra-fast neural inference, graph-based face clustering, and zero-cloud biometric privacy engineered in C++ for cross-platform edge deployments.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SMSGEE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <title>SMSGEE | On-Device Biometric Intelligence & Face Explorer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #07090E;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Loading screen with modern biometric cyber aesthetic */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0F172A 0%, #07090E 100%);
      z-index: 99999;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: auto;
    }
    .spinner-wrapper {
      position: relative;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .spinner-glow {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.25) 0%, transparent 70%);
      animation: pulse-glow 2s ease-in-out infinite alternate;
    }
    .spinner {
      width: 46px;
      height: 46px;
      border: 3px solid rgba(0, 242, 254, 0.12);
      border-top: 3px solid #00F2FE;
      border-right: 3px solid rgba(121, 40, 202, 0.6);
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }
    .brand-title {
      color: #F8FAFC;
      font-weight: 800;
      letter-spacing: 2px;
      margin-top: 24px;
      font-size: 15px;
      text-transform: uppercase;
      opacity: 0.95;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-glow {
      0% { transform: scale(0.9); opacity: 0.4; }
      100% { transform: scale(1.3); opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner-wrapper">
      <div class="spinner-glow"></div>
      <div class="spinner"></div>
    </div>
    <div class="brand-title">SMSGEE</div>
  </div>

  <script>
    (function () {
      var APP_VERSION_KEY = "smsgee_app_version";

      function removeLoader() {
        var loader = document.getElementById("loading");
        if (loader) {
          loader.style.opacity = "0";
          loader.style.pointerEvents = "none";
          setTimeout(function () {
            if (loader && loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 400);
        }
      }

      window.addEventListener("flutter-first-frame", function () {
        console.info("[SMSGEE Loader] Flutter first frame rendered.");
        removeLoader();
      });

      window.addEventListener("load", function () {
        // Fallback safety timeout if first-frame event is missed
        setTimeout(removeLoader, 3500);
      });

      async function fetchServerVersion() {
        var controller = new AbortController();
        var timeoutId = setTimeout(function () {
          controller.abort();
        }, 2500);

        try {
          var response = await fetch("version.json?t=" + Date.now(), {
            method: "GET",
            headers: {
              "Cache-Control": "no-cache, no-store, must-revalidate",
              "Pragma": "no-cache",
              "Expires": "0"
            },
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          if (response.ok) {
            var data = await response.json();
            return data.version + "+" + data.build_number;
          }
        } catch (err) {
          console.warn("[SMSGEE Loader] Version check skipped (offline or network timeout):", err.message || err);
        }
        return null;
      }

      async function purgeAllCaches() {
        console.info("[SMSGEE Loader] Purging CacheStorage & Service Workers...");
        try {
          if ("caches" in window) {
            var cacheNames = await caches.keys();
            await Promise.all(
              cacheNames.map(function (name) {
                console.debug("[SMSGEE Loader] Deleting cache bucket:", name);
                return caches.delete(name);
              })
            );
          }
          if ("serviceWorker" in navigator) {
            var registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              registrations.map(function (reg) {
                console.debug("[SMSGEE Loader] Unregistering service worker:", reg);
                return reg.unregister();
              })
            );
          }
          console.info("[SMSGEE Loader] Cache purged successfully.");
        } catch (err) {
          console.warn("[SMSGEE Loader] Error during cache purge:", err);
        }
      }

      function loadFlutterBootstrap(cacheBust) {
        var script = document.createElement("script");
        var url = cacheBust ? "flutter_bootstrap.js?v=" + Date.now() : "flutter_bootstrap.js";
        script.src = url;
        script.async = true;
        document.body.appendChild(script);
      }

      async function init() {
        console.info("[SMSGEE Loader] Initializing SMSGEE Web App...");
        var localVersion = localStorage.getItem(APP_VERSION_KEY);
        var serverVersion = await fetchServerVersion();

        var cacheBust = false;

        if (serverVersion) {
          console.info("[SMSGEE Loader] Local version: " + (localVersion || "None") + " | Server version: " + serverVersion);
          if (localVersion && localVersion !== serverVersion) {
            console.info("[SMSGEE Loader] App update detected (" + localVersion + " -> " + serverVersion + "). Invalidating cache...");
            await purgeAllCaches();
            cacheBust = true;
          }
          localStorage.setItem(APP_VERSION_KEY, serverVersion);
        } else {
          console.info("[SMSGEE Loader] Running in cached / offline mode.");
        }

        console.info("[SMSGEE Loader] Bootstrapping Flutter engine...");
        loadFlutterBootstrap(cacheBust);
      }

      init();
    })();
  </script>
</body>
</html>
